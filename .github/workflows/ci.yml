name: Bird Fuzzing CI With Docker

on:
  push:
    branches:
      - binary-based
      - CI-branch

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2  

      - name: Build Docker image from Dockerfile
        run: |
          docker build -f Dockerfile -t bird-fuzzing . 

      - name: Run fuzz tests with colored output
        run: |
          docker run bird-fuzzing    
          docker cp $(docker ps -a -q | head -n 1):/bird-fuzzing/output.txt bird-fuzzing/output.txt
          docker rm $(docker ps -a -q | head -n 1)

      - name: Upload folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-results
          path: bird-fuzzing/

